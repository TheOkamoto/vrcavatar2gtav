name: CI Validation & UnityPackage SemVer Release

on:
  push:
    branches:
      - unity-ui
  pull_request:
    branches:
      - unity-ui
  workflow_dispatch:
    inputs:
      release_blocker:
        description: "Hotfix / GTA V deployment blocker fix: release immediately bypassing the 3-commit rule"
        required: false
        type: boolean
        default: false
      force_release:
        description: "Force a new SemVer release even if fewer than 3 commits exist since the last release tag"
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Source, GTA Deploy Blocker Gate & UnityPackage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run full source-only test suite (11 suites)
        run: python scripts/common_tools/test_mod_suite.py --source-only --lang en

      - name: Run SemVer release calculator unit checks
        run: python .github/scripts/compute_release_version.py --self-test

  release:
    name: SemVer UnityPackage Release (Every 3 Commits)
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/unity-ui'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Evaluate 3-commit SemVer & GTA V release-blocker cadence
        id: semver
        env:
          FORCE_RELEASE: ${{ inputs.force_release || 'false' }}
          RELEASE_BLOCKER: ${{ inputs.release_blocker || 'false' }}
          DEPLOY_CHECK_PASSED: ${{ needs.validate.result == 'success' && 'true' || 'false' }}
        run: python .github/scripts/compute_release_version.py --notes-out dist/release_notes.md

      - name: Build & verify versioned VRCAvatar2GTAV.unitypackage
        if: steps.semver.outputs.should_release == 'true'
        run: |
          mkdir -p dist
          TAG="${{ steps.semver.outputs.tag }}"
          VER="${{ steps.semver.outputs.version }}"
          PKG="dist/VRCAvatar2GTAV-${TAG}.unitypackage"
          python unity_plugin/build_unitypackage.py --version "${VER}" --output "${PKG}" --verify
          sha256sum "${PKG}" > "${PKG}.sha256"
          (cd dist && sha256sum "VRCAvatar2GTAV-${TAG}.unitypackage" > SHA256SUMS.txt)

      - name: Create annotated SemVer tag & publish GitHub Release
        if: steps.semver.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.semver.outputs.tag }}"
          PKG="dist/VRCAvatar2GTAV-${TAG}.unitypackage"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" "${{ github.sha }}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"
          gh release create "${TAG}" \
            "${PKG}" \
            "${PKG}.sha256" \
            "dist/SHA256SUMS.txt" \
            --verify-tag \
            --title "VRCAvatar2GTAV ${TAG}" \
            --notes-file "dist/release_notes.md"

      - name: Upload built UnityPackage workflow artifact
        if: steps.semver.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VRCAvatar2GTAV-${{ steps.semver.outputs.tag }}
          path: dist/VRCAvatar2GTAV-*.unitypackage*
          if-no-files-found: error

      - name: Write workflow summary
        run: |
          {
            echo "### VRCAvatar2GTAV CI/CD Release Cadence"
            if [ "${{ steps.semver.outputs.release_blocked }}" = "true" ]; then
              echo "- **Status**: **RELEASE BLOCKED** (\`${{ steps.semver.outputs.release_reason }}\`) — GTA V deployment validation must pass cleanly."
            elif [ "${{ steps.semver.outputs.should_release }}" = "true" ]; then
              echo "- **Status**: Released \`${{ steps.semver.outputs.tag }}\` (\`${{ steps.semver.outputs.bump_level }}\` bump via \`${{ steps.semver.outputs.release_reason }}\` from \`${{ steps.semver.outputs.prev_tag || 'initial' }}\` after \`${{ steps.semver.outputs.commit_count }}\` commit(s))"
              echo "- **UnityPackage**: \`VRCAvatar2GTAV-${{ steps.semver.outputs.tag }}.unitypackage\`"
            else
              echo "- **Status**: Validation passed — waiting for next release (${{ steps.semver.outputs.commit_count }}/${{ steps.semver.outputs.commits_required }} commits since \`${{ steps.semver.outputs.prev_tag || 'start' }}\`, \`${{ steps.semver.outputs.commits_remaining }}\` remaining)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
